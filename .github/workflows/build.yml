name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 4GiB
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit tests and static analysis
        run: make test
      - name: Native Tuwunel, S3 and encrypted-room integration
        run: make integration
      - name: Package Linux amd64 executable
        env:
          COMMIT: ${{ github.sha }}
        run: make dist VERSION="dev-${COMMIT:0:12}" COMMIT="$COMMIT"
      - name: Smoke test the packaged binary
        run: |
          mkdir "$RUNNER_TEMP/tg-import"
          (cd dist && sha256sum -c SHA256SUMS)
          tar -xzf dist/tg-import-linux-amd64.tar.gz -C "$RUNNER_TEMP/tg-import"
          "$RUNNER_TEMP/tg-import/tg-import" version
          "$RUNNER_TEMP/tg-import/tg-import" -help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tg-import-linux-amd64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
